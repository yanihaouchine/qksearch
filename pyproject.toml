[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qksearch"
version = "1.0.0"
description = "Combinatorial search for quantum-kernel circuits, guided by training-free kernel-quality heuristics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yani Haouchine", email = "yanihaouchine@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "quantum machine learning",
    "quantum kernels",
    "kernel methods",
    "architecture search",
    "IQP circuits",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pennylane>=0.40",
    "qiskit[visualization]>=2.0",
]

[project.urls]
Repository = "https://github.com/yanihaouchine/qksearch"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["qksearch*"]

[tool.setuptools.package-data]
"qksearch.dataset" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "check_equivalence.py"]
pythonpath = ["."]
markers = ["slow: tests that take more than a minute (deselected in CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results", "report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905", "E731"]
