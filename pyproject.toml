[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qksearch"
version = "1.0.0"
description = "Recherche combinatoire de circuits IQP pour noyaux quantiques, guidée par l'alignement noyau-cible (KTA)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yani Haouchine", email = "yanihaouchine@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pennylane>=0.40",
    "qiskit[visualization]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["qksearch*"]

[tool.setuptools.package-data]
"qksearch.dataset" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "check_equivalence.py"]
pythonpath = ["."]
markers = ["slow: tests de plus d'une minute (désélectionnés en CI)"]
